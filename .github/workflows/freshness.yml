name: Rule Pack Freshness Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync

      - name: Run Freshness Check
        run: uv run python scripts/freshness_check.py
