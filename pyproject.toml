[project]
name = "papertrail"
version = "0.1.0"
description = "PaperTrail - Grounded, multilingual legal document assistant for Indian consumers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6.0",
    "pymupdf>=1.26.5",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
